<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
  <title id="t">How the WooCommerce Soundbox works</title>
  <desc id="d">A customer orders, WooCommerce marks the order processing, the ESP32 asks the store's REST API every 10 seconds with a read-only key, finds new order IDs, shows the order on the OLED and speaks the amount.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="22" font-weight="600" fill="#111827">How it works</text>
  <text x="32" y="70" font-size="14" fill="#5b6472">From a new order on your store to the spoken amount, in about 5–15 seconds</text>

  <g>
    <rect x="32" y="112" width="160" height="96" rx="12" fill="#eef6fd" stroke="#46c1f1" stroke-width="1.5"/>
    <text x="112" y="146" font-size="15" font-weight="600" fill="#0b4f6c" text-anchor="middle">1. Order</text>
    <text x="112" y="170" font-size="13" fill="#3b6b80" text-anchor="middle">Customer orders</text>
    <text x="112" y="188" font-size="13" fill="#3b6b80" text-anchor="middle">(COD or paid)</text>
  </g>
  <line x1="192" y1="160" x2="236" y2="160" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="240" y="112" width="160" height="96" rx="12" fill="#eef6fd" stroke="#46c1f1" stroke-width="1.5"/>
    <text x="320" y="146" font-size="15" font-weight="600" fill="#0b4f6c" text-anchor="middle">2. Your store</text>
    <text x="320" y="170" font-size="13" fill="#3b6b80" text-anchor="middle">WooCommerce marks</text>
    <text x="320" y="188" font-size="13" fill="#3b6b80" text-anchor="middle">it "Processing"</text>
  </g>
  <line x1="400" y1="160" x2="444" y2="160" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <text x="422" y="148" font-size="12" fill="#5b6472" text-anchor="middle">API</text>

  <g>
    <rect x="448" y="104" width="200" height="112" rx="12" fill="#f3f0ff" stroke="#7c6cd6" stroke-width="1.5"/>
    <text x="548" y="138" font-size="15" font-weight="600" fill="#3b2f87" text-anchor="middle">3. ESP32</text>
    <text x="548" y="162" font-size="13" fill="#5a4fa8" text-anchor="middle">asks every 10 s with a</text>
    <text x="548" y="180" font-size="13" fill="#5a4fa8" text-anchor="middle">read-only key, finds</text>
    <text x="548" y="198" font-size="13" fill="#5a4fa8" text-anchor="middle">order IDs it hasn't seen</text>
  </g>

  <path d="M648 140 C 690 140, 690 120, 724 120" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <path d="M648 180 C 690 180, 690 220, 724 220" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="728" y="88" width="200" height="64" rx="12" fill="#ecfdf3" stroke="#3fb950" stroke-width="1.5"/>
    <text x="828" y="116" font-size="15" font-weight="600" fill="#14532d" text-anchor="middle">OLED screen</text>
    <text x="828" y="138" font-size="13" fill="#2f6b45" text-anchor="middle">"#4521 Rahul  Rs.1499"</text>
  </g>
  <g>
    <rect x="728" y="188" width="200" height="64" rx="12" fill="#ecfdf3" stroke="#3fb950" stroke-width="1.5"/>
    <text x="828" y="216" font-size="15" font-weight="600" fill="#14532d" text-anchor="middle">Speaker + LED</text>
    <text x="828" y="238" font-size="13" fill="#2f6b45" text-anchor="middle">"...of rupees 1499"</text>
  </g>

  <line x1="32" y1="284" x2="928" y2="284" stroke="#e5e7eb"/>
  <text x="32" y="312" font-size="13" fill="#5b6472">Nothing is installed on the website: no plugin, no code. Only a read-only WooCommerce REST API key.</text>
  <text x="32" y="334" font-size="13" fill="#5b6472">Voice: Google Translate text-to-speech (free, no key) → MAX98357A amplifier. If the voice fails, it beeps.</text>
</svg>
